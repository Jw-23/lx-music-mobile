name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  Android:
    name: Validate and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Validate tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Validate application
        run: |
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Build signed packages
        env:
          DISABLE_SVG: 1
          SIGNING_FILE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          SIGNING_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          SIGNING_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$SIGNING_FILE_BASE64"
          test -n "$SIGNING_FILE"
          test -n "$SIGNING_ALIAS"
          test -n "$SIGNING_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          cd android
          trap 'rm -f "app/$SIGNING_FILE"' EXIT
          printf '%s' "$SIGNING_FILE_BASE64" | base64 --decode > "app/$SIGNING_FILE"
          ./gradlew assembleRelease --no-daemon \
            -PMYAPP_UPLOAD_STORE_FILE="$SIGNING_FILE" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$SIGNING_ALIAS" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$SIGNING_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-v${{ env.PACKAGE_VERSION }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  Release:
    name: Publish GitHub release
    needs: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish release and APKs
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
