<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>LX Music · 手机控制</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div class="brand"><span class="mark">♪</span><div><strong>LX Music</strong><small id="connection">局域网控制</small></div></div><button id="logout" class="quiet" hidden>断开</button></header>
<main>
<section id="pair" class="pair card"><span class="eyebrow">就在你的电视上</span><h1>音乐，随手掌控。</h1><p class="muted">在电视的“手机控制”中查看配对码。手机与电视需连接同一网络。</p><form id="pair-form"><label for="code">六位配对码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required><button class="primary" type="submit">连接电视</button></form><p id="pair-error" role="alert" class="error"></p></section>
<div id="workspace" hidden>
<section class="playing card"><div><span class="eyebrow">正在电视播放</span><h2 id="song-name">选择一首喜欢的歌</h2><p id="song-singer" class="muted"></p><p id="song-status" class="muted small" aria-live="polite"></p></div><div class="transport"><button data-player="previous" aria-label="上一首">⏮</button><button data-player="rewind" aria-label="后退十秒">−10</button><button data-player="toggle" id="play-toggle" aria-label="播放或暂停">▶</button><button data-player="forward" aria-label="前进十秒">+10</button><button data-player="next" aria-label="下一首">⏭</button></div></section>
<nav class="tabs" aria-label="控制功能"><button data-tab="search" aria-selected="true">搜索</button><button data-tab="sources" aria-selected="false">音源</button><button data-tab="settings" aria-selected="false">设置</button></nav>
<section id="search" class="page"><div class="section-title"><h1>找到想听的。</h1><p class="muted">手机搜索，电视播放。</p></div><form id="search-form" class="card"><label for="query">歌名或歌手</label><div class="search-row"><input id="query" type="search" maxlength="120" placeholder="搜索音乐" required><button class="primary" type="submit">搜索</button></div><label for="platform">音乐平台</label><select id="platform"></select></form><p id="search-feedback" class="muted" role="status"></p><div id="results" class="card results" hidden></div><div class="paging"><button id="prev-page" class="quiet" hidden>上一页</button><span id="page-info" class="muted"></span><button id="next-page" class="quiet" hidden>下一页</button></div></section>
<section id="sources" class="page" hidden><div class="section-title"><h1>让音乐就绪。</h1><p class="muted">从手机导入你的音源，保存在电视。</p></div><div class="card"><h2>导入音源</h2><form id="url-form"><label for="source-url">音源链接</label><input id="source-url" type="url" placeholder="https://" maxlength="4096" required><button class="primary" type="submit">从链接导入</button></form><div class="divider"></div><form id="file-form"><label for="source-file">或选择手机中的音源文件（最大 4 MB）</label><input id="source-file" type="file" accept=".js,.txt,application/javascript,text/javascript,text/plain" required><button class="secondary" type="submit">上传并导入</button></form><p class="muted small">导入后可点击“使用此源”。请选择你信任的脚本。</p><p id="source-feedback" role="status"></p></div><div class="section-title"><h2>电视上的音源</h2><button id="refresh-sources" class="quiet">刷新</button></div><div id="source-list" class="card"></div></section>
<section id="settings" class="page" hidden><div class="section-title"><h1>按你的习惯。</h1><p class="muted">更改会同步保存到电视。</p></div><div id="settings-list" class="card"></div></section>
</div></main><div id="toast" role="status" hidden></div><footer>与电视直接连接 · LX Music</footer></body></html>
