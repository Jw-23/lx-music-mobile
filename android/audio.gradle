// Build our audio integration from owned sources without changing node_modules.
def playerProject = project(':react-native-track-player')
playerProject.afterEvaluate {
    def originalJava = new File(playerProject.projectDir, 'src/main/java')
    def generatedJava = playerProject.layout.buildDirectory.dir('generated/lxAudio/java')
    def prepareAudio = playerProject.tasks.register('prepareLXAudio', Sync) {
        from(originalJava)
        into(generatedJava)
        filesMatching('**/MusicManager.java') {
            filter { line ->
                line.replace('new DefaultRenderersFactory(service)',
                    'new com.guichaguri.trackplayer.audio.NormalizingRenderersFactory(service)')
                    .replace('shouldEnableAudioOffload = options.getBoolean("audioOffload", true)',
                        'shouldEnableAudioOffload = false')
            }
        }
    }
    // A task-backed source directory also wires its producer into every Java compile.
    playerProject.extensions.getByName('android').sourceSets.main.java.setSrcDirs([
        prepareAudio, rootProject.file('audio/src/main/java')
    ])
}
